name: Validate site

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_CONTACT_ENDPOINT: https://yottabyte-contact.raio20061114.workers.dev/contact
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-HY3D6EJ7XP
      - run: node scripts/verify-static-export.mjs
